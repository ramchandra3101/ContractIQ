name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: cp .env.example .env
      - run: docker compose --profile app up -d --build
      - name: Wait for infrastructure readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose down -v
        if: always()
