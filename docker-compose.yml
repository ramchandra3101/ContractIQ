services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: contractiq
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: contractiq
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractiq -d contractiq"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: contractiq
      MINIO_ROOT_PASSWORD: local-minio-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set local http://minio:9000 contractiq local-minio-password && mc mb --ignore-existing local/contractiq; then
            exit 0
          fi
          sleep 2
        done
        exit 1
  migrate:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://contractiq:local-postgres-password@postgres:5432/contractiq
    command: ["node", "packages/database/node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "packages/database/prisma/schema.prisma"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contractiq:local-postgres-password@postgres:5432/contractiq
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["127.0.0.1:3000:3000"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  redis-data:
  minio-data:
