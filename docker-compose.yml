services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: contractiq
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: contractiq
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractiq -d contractiq"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  # MinIO images were removed from Docker Hub in 2026; RustFS is an S3-compatible replacement.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: contractiq
      RUSTFS_SECRET_KEY: local-minio-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage-data:/data"]
  storage-init:
    image: amazon/aws-cli:2.38.2
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: contractiq
      AWS_SECRET_ACCESS_KEY: local-minio-password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if aws --endpoint-url http://storage:9000 s3api head-bucket --bucket contractiq 2>/dev/null \
            || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket contractiq; then
            exit 0
          fi
          sleep 2
        done
        exit 1
  migrate:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://contractiq:local-postgres-password@postgres:5432/contractiq
    command: ["node", "packages/database/node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "packages/database/prisma/schema.prisma"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contractiq:local-postgres-password@postgres:5432/contractiq
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
    ports: ["127.0.0.1:3000:3000"]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  redis-data:
  storage-data:
